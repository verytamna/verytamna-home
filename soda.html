<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>베리탐나 농원 | 시안 B</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#16204a; --muted:#4a5578; --accent:#2c3c86;
  --sans:'Pretendard Variable',Pretendard,system-ui,sans-serif;
  --serif:'Noto Serif KR',serif;
  --script:'Lobster',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);overflow:hidden;word-break:keep-all;background:linear-gradient(180deg,#eef4ff 0%,#f6f9ff 70%,#f2f4f8 100%)}
a{color:inherit;text-decoration:none}

/* photo stage */
.stage{position:fixed;inset:0;overflow:hidden;z-index:0}
.stage picture{position:absolute;inset:0}
.stage img{position:absolute;right:-2%;bottom:0;height:80%;width:auto;max-width:none;transform-origin:70% 85%;will-change:transform;transition:transform 1.2s cubic-bezier(.2,.7,.2,1);animation:settle 2.2s cubic-bezier(.2,.7,.2,1) both;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%),linear-gradient(180deg,transparent 0%,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 30%),linear-gradient(180deg,transparent 0%,#000 22%);mask-composite:intersect}
@keyframes settle{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(243,247,255,.6) 0%,rgba(243,247,255,0) 40%)}
canvas#fx{position:fixed;inset:0;z-index:1;touch-action:none}

.ui{position:fixed;inset:0;z-index:2;pointer-events:none;padding:28px 44px}
.ui a,.ui button{pointer-events:auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(22,32,74,.12)}
.pill{display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px -12px rgba(22,32,74,.25)}
.pill a{padding:9px 18px;border-radius:999px;font-size:14px;color:var(--muted);transition:background .3s,color .3s}
.pill a:hover{background:rgba(255,255,255,.7)}
.pill a.on{background:var(--ink);color:#fff;font-weight:600}
.cta-top{background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600}

.head{position:absolute;left:44px;top:22vh;max-width:440px}
.head .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--accent);font-weight:700;margin-bottom:18px}
.head h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,4.4vw,62px);line-height:1.22;letter-spacing:-.02em;margin-bottom:22px;color:var(--ink)}
.head p{font-size:16px;line-height:1.75;color:var(--muted);margin-bottom:30px}
.shop{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 7px 7px 24px;font-weight:600;font-size:15px;box-shadow:0 12px 30px -12px rgba(22,32,74,.5)}
.shop i{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:500;transition:transform .3s}
.shop:hover i{transform:rotate(90deg)}

.grades{position:absolute;left:44px;bottom:110px;display:flex;gap:12px}
.grade{width:124px;padding:14px 12px 12px;border-radius:20px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 10px 30px -16px rgba(22,32,74,.35);transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s,border-color .35s}
.grade:hover{transform:translateY(-4px)}
.grade.on{background:#fff;border-color:var(--ink)}
.grade strong{display:block;font-family:var(--serif);font-size:19px;margin-bottom:2px}
.grade small{display:block;font-size:12px;color:var(--muted)}
.grade em{display:block;font-style:normal;font-weight:700;font-size:14px;margin-top:8px}

.badge{position:absolute;left:44px;bottom:36px;display:flex;align-items:center;gap:12px}
.badge .ico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid #fff;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink)}
.badge span{font-size:11px;letter-spacing:.18em;color:var(--muted);display:block}
.badge b{font-size:14px;letter-spacing:.04em}
.script{position:absolute;right:44px;bottom:16px;font-family:var(--script);font-size:clamp(60px,9vw,136px);line-height:1;color:#fff;text-shadow:0 8px 40px rgba(10,20,60,.45);pointer-events:none}
.hint{position:absolute;right:48px;top:96px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.draft{position:absolute;left:50%;top:86px;transform:translateX(-50%);font-size:11px;font-weight:700;color:#5a3a00;background:#ffd98a;border-radius:6px;padding:3px 8px}
.m-order{display:none}

.ui .fade{opacity:0;transform:translateY(18px);animation:in 1s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.25s!important}.d2{animation-delay:.4s!important}.d3{animation-delay:.55s!important}.d4{animation-delay:.7s!important}
@keyframes in{to{opacity:1;transform:none}}

@media (max-width:900px){
  .ui{padding:18px}
  .pill,.badge,.hint,.script{display:none}
  .stage img{right:0;left:0;bottom:auto;top:26vh;height:48vh;width:100%;object-fit:cover;object-position:66% 50%;transform-origin:50% 50%;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 80%,transparent 100%)}
  .stage::after{background:linear-gradient(180deg,rgba(243,247,255,.95) 0%,rgba(243,247,255,.75) 30%,rgba(243,247,255,0) 50%,rgba(243,247,255,0) 62%,rgba(243,247,255,.85) 82%,rgba(243,247,255,.95) 100%)}
  .head{left:20px;right:20px;top:80px;max-width:none}
  .head .eyebrow{margin-bottom:10px;font-size:11px}
  .head h1{font-size:30px;margin-bottom:10px}
  .head p{font-size:14px;margin-bottom:0}
  .head .shop{display:none}
  .grades{left:18px;right:18px;bottom:96px;gap:10px}
  .grade{flex:1;width:auto;padding:12px 10px 10px;text-align:center}
  .grade strong{font-size:17px}
  .grade em{margin-top:4px;font-size:13px}
  .m-order{display:flex;position:absolute;left:18px;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));height:56px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;align-items:center;justify-content:center}
  .draft{top:62px}
}
@media (prefers-reduced-motion:reduce){.ui .fade{animation:none;opacity:1;transform:none}.stage img{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <img id="photo" src="img/b-hero.jpg" alt="물방울이 맺힌 블루베리">
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="ui">
  <div class="top fade">
    <a href="index.html" class="brand"><img src="img/logo.png" alt="">베리탐나 농원</a>
    <nav class="pill">
      <a href="#" class="on">홈</a>
      <a href="story.html">농장 이야기</a>
      <a href="quality.html">품질</a>
      <a href="visit.html">오시는 길</a>
    </nav>
    <a href="https://verytamna.github.io/verytamna/" class="cta-top">주문하기</a>
  </div>
  <div class="draft">시안 B · 사진형</div>

  <div class="head">
    <div class="eyebrow fade d1">GYEONGJU · GAP FARM</div>
    <h1 class="fade d2">당신이 탐내는<br>바로 그 맛.</h1>
    <p class="fade d3">경주 산수밭들의 햇살 아래 정성껏 키워<br>수확한 그날 보내드립니다.</p>
    <a href="https://verytamna.github.io/verytamna/" class="shop fade d4">블루베리 주문하기 <i>+</i></a>
  </div>

  <div class="grades fade d3" role="radiogroup" aria-label="등급 선택">
    <button class="grade on" data-g="0" role="radio" aria-checked="true"><strong>왕특</strong><small>18mm 이상</small><em>45,000원/kg</em></button>
    <button class="grade" data-g="1" role="radio" aria-checked="false"><strong>특대</strong><small>16~18mm</small><em>40,000원/kg</em></button>
    <button class="grade" data-g="2" role="radio" aria-checked="false"><strong>대</strong><small>14~16mm</small><em>35,000원/kg</em></button>
  </div>

  <div class="badge fade d4"><div class="ico">GAP</div><div><span>CERTIFIED FARM</span><b>경주 · 가족 블루베리 농장</b></div></div>
  <div class="hint fade d4">화면을 눌러보세요</div>
  <div class="script">Verytamna</div>
  <a href="https://verytamna.github.io/verytamna/" class="m-order">블루베리 주문하기 →</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var photo = document.getElementById('photo');

  // photo follows the pointer slightly; grade changes the framing
  var ZOOM = [1.0, 0.96, 0.92];
  var zoom = 1, tx = 0, ty = 0, cx = 0, cy = 0;
  function applyPhoto(){ photo.style.transform = 'translate3d('+(cx*-18)+'px,'+(cy*-12)+'px,0) scale('+zoom+')'; }
  window.addEventListener('pointermove', function(e){ tx = (e.clientX/innerWidth)*2-1; ty = (e.clientY/innerHeight)*2-1; });
  document.querySelectorAll('.grade').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.grade').forEach(function(b){ b.classList.toggle('on', b===btn); b.setAttribute('aria-checked', b===btn); });
      zoom = ZOOM[+btn.dataset.g]; applyPhoto();
    });
  });

  if(!window.THREE){ return; }
  var canvas = document.getElementById('fx');
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100); camera.position.set(0,0,9);
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x2a3360, 0.6));
  var key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-4,6,6); scene.add(key);
  var rim = new THREE.DirectionalLight(0xb8c8ff, 0.8); rim.position.set(5,1,-5); scene.add(rim);

  function rng(seed){ return function(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }; }
  function skin(seed){
    var R = rng(seed), W = 512, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d'); g.fillStyle = '#1c2655'; g.fillRect(0,0,W,H);
    for(var i=0;i<70;i++){ var x=R()*W,y=R()*H,r=20+R()*60,gr=g.createRadialGradient(x,y,0,x,y,r),a=.12+R()*.2;
      gr.addColorStop(0,'rgba(150,168,215,'+a+')'); gr.addColorStop(1,'rgba(150,168,215,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
    for(var k=0;k<20000;k++){ g.fillStyle='rgba(185,198,232,'+(R()*.16)+')'; g.fillRect(R()*W,R()*H,1.3,1.3); }
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  var mats = [skin(11), skin(29), skin(53)].map(function(m){ return new THREE.MeshStandardMaterial({map:m, roughness:0.75}); });
  var calyx = new THREE.MeshStandardMaterial({color:0x2a2738, roughness:0.9});
  function geo(seed){
    var R = rng(seed), g = new THREE.SphereGeometry(1, 40, 30), p = g.attributes.position, v = new THREE.Vector3(), a=R()*6, b=R()*6;
    for(var i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); v.multiplyScalar(1+0.025*Math.sin(v.x*3+a)*Math.cos(v.z*2.6+b));
      if(v.y>0.72){ var t=(v.y-0.72)/0.28; v.y-=0.15*t*t*(3-2*t); } v.y*=0.84; p.setXYZ(i,v.x,v.y,v.z); }
    g.computeVertexNormals(); return g;
  }
  var geos = [geo(7), geo(19), geo(41)];
  var sepal = new THREE.ConeGeometry(0.1, 0.26, 5, 1); sepal.translate(0,0.13,0); sepal.scale(1,1,0.45);
  var n = 0;
  function berry(){
    var i = n++ % 3, grp = new THREE.Group();
    grp.add(new THREE.Mesh(geos[i], mats[i]));
    var cr = new THREE.Group();
    for(var k=0;k<5;k++){ var ang=k/5*Math.PI*2, s=new THREE.Mesh(sepal, calyx); s.position.set(Math.cos(ang)*.12,0,Math.sin(ang)*.12); s.rotation.order='YXZ'; s.rotation.y=-ang+Math.PI/2; s.rotation.x=.9; cr.add(s); }
    cr.position.y = 0.705; grp.add(cr); return grp;
  }

  var bursts = [], ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0), hit = new THREE.Vector3();
  function burst(x, y){
    ray.setFromCamera(new THREE.Vector2((x/innerWidth)*2-1, -(y/innerHeight)*2+1), camera); ray.ray.intersectPlane(plane, hit);
    for(var i=0;i<8;i++){
      var b = berry(), s = 0.11+Math.random()*0.11; b.scale.setScalar(s); b.position.copy(hit);
      b.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
      var a = Math.random()*Math.PI*2, v = 0.05+Math.random()*0.07;
      b.userData = {v:new THREE.Vector3(Math.cos(a)*v, Math.sin(a)*v+0.04, (Math.random()-.5)*0.05), life:1, s:s, spin:new THREE.Vector3(Math.random()*.15,Math.random()*.15,0)};
      scene.add(b); bursts.push(b);
    }
  }
  canvas.addEventListener('pointerdown', function(e){ burst(e.clientX, e.clientY); });

  function layout(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', layout); layout();

  var clock = new THREE.Clock();
  function tick(){
    var dt = Math.min(clock.getDelta(), 0.05);
    if(!reduce){ cx += (tx-cx)*0.05; cy += (ty-cy)*0.05; applyPhoto(); }
    for(var i=bursts.length-1;i>=0;i--){
      var b = bursts[i], u = b.userData;
      b.position.add(u.v); u.v.y -= 0.0028; u.v.multiplyScalar(0.985);
      b.rotation.x += u.spin.x; b.rotation.y += u.spin.y;
      u.life -= dt*0.55; b.scale.setScalar(Math.max(0.0001, u.s*Math.min(1, u.life*2)));
      if(u.life <= 0){ scene.remove(b); bursts.splice(i,1); }
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
