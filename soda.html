<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>베리탐나 농원 | 시안 B</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg1:#24336e; --bg2:#0b1230;
  --accent:#c9d4ff;
  --sans:'Pretendard Variable',Pretendard,system-ui,sans-serif;
  --serif:'Noto Serif KR',serif;
  --script:'Lobster',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:#fff;overflow:hidden;word-break:keep-all;
  background:radial-gradient(120% 90% at 50% 40%,var(--bg1) 0%,var(--bg2) 75%);
  transition:background 1s ease}
a{color:inherit;text-decoration:none}
#bgfade{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .9s ease}
canvas#scene{position:fixed;inset:0;z-index:1;touch-action:none}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;padding:28px 44px}
.ui a,.ui button{pointer-events:auto}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff}
.pill{display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill a{padding:9px 18px;border-radius:999px;font-size:14px;color:rgba(255,255,255,.85);transition:background .3s,color .3s}
.pill a:hover{background:rgba(255,255,255,.1)}
.pill a.on{background:var(--accent);color:#141a33;font-weight:600}
.cta-top{background:#0a0f24;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.12)}

/* headline */
.head{position:absolute;left:44px;top:21vh;max-width:420px}
.head .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--accent);font-weight:600;margin-bottom:18px}
.head h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,4.4vw,62px);line-height:1.22;letter-spacing:-.02em;margin-bottom:22px;text-shadow:0 6px 30px rgba(0,0,0,.25)}
.head p{font-size:16px;line-height:1.75;color:rgba(255,255,255,.78);margin-bottom:30px}
.shop{display:inline-flex;align-items:center;gap:14px;background:#0a0f24;border-radius:999px;padding:7px 7px 7px 24px;font-weight:600;font-size:15px;border:1px solid rgba(255,255,255,.12)}
.shop i{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#141a33;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:500;transition:transform .3s}
.shop:hover i{transform:rotate(90deg)}

/* grade picker */
.grades{position:absolute;right:44px;top:15vh;display:flex;gap:14px}
.grade{width:132px;padding:18px 14px 16px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;cursor:pointer;text-align:center;font-family:inherit;transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s,border-color .35s}
.grade:hover{transform:translateY(-4px)}
.grade.on{background:rgba(255,255,255,.18);border-color:var(--accent)}
.grade .dots{height:44px;display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-bottom:12px}
.grade .dots b{display:block;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a9b6ea,#3a4b8c 60%,#222c58)}
.grade strong{display:block;font-family:var(--serif);font-size:20px;margin-bottom:2px}
.grade small{display:block;font-size:12px;color:rgba(255,255,255,.7)}
.grade em{display:block;font-style:normal;font-weight:700;font-size:14px;margin-top:8px}

/* bottom */
.badge{position:absolute;left:44px;bottom:36px;display:flex;align-items:center;gap:14px}
.badge .ico{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px;font-weight:700}
.badge span{font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.6);display:block}
.badge b{font-size:14px;letter-spacing:.06em}
.script{position:absolute;right:40px;bottom:10px;font-family:var(--script);font-size:clamp(64px,10vw,150px);line-height:1;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.25);letter-spacing:-.01em;pointer-events:none}
.hint{position:absolute;right:44px;top:calc(15vh + 182px);font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.08em;white-space:nowrap}
.draft{position:absolute;left:50%;top:86px;transform:translateX(-50%);font-size:11px;font-weight:700;color:#5a3a00;background:#ffd98a;border-radius:6px;padding:3px 8px}

/* intro */
.ui .fade{opacity:0;transform:translateY(18px);animation:in 1s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.2s!important}.d2{animation-delay:.35s!important}.d3{animation-delay:.5s!important}.d4{animation-delay:.65s!important}
@keyframes in{to{opacity:1;transform:none}}

@media (max-width:900px){
  .ui{padding:18px 18px}
  .pill{display:none}
  .head{left:20px;right:20px;top:86px;max-width:none}
  .head .eyebrow{margin-bottom:10px;font-size:11px}
  .head h1{font-size:30px;margin-bottom:10px}
  .head p{font-size:14px;margin-bottom:0}
  .head .shop{display:none}
  .grades{left:18px;right:18px;top:auto;bottom:96px;justify-content:space-between;gap:10px}
  .grade{flex:1;width:auto;padding:12px 8px 10px;border-radius:18px}
  .grade .dots{height:30px;margin-bottom:6px}
  .grade strong{font-size:17px}
  .grade em{margin-top:4px;font-size:13px}
  .badge{display:none}
  .script{display:none}
  .hint{display:none}
  .m-order{display:flex!important}
  .draft{top:62px}
}
.m-order{display:none;position:absolute;left:18px;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));height:56px;border-radius:999px;background:#fff;color:#141a33;font-weight:700;font-size:16px;align-items:center;justify-content:center;gap:10px}
@media (prefers-reduced-motion:reduce){.ui .fade{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bgfade"></div>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="ui">
  <div class="top fade">
    <a href="index.html" class="brand"><img src="img/logo.png" alt="">베리탐나 농원</a>
    <nav class="pill">
      <a href="#" class="on">홈</a>
      <a href="story.html">농장 이야기</a>
      <a href="quality.html">품질</a>
      <a href="visit.html">오시는 길</a>
    </nav>
    <a href="https://verytamna.github.io/verytamna/" class="cta-top">주문하기</a>
  </div>
  <div class="draft">시안 B · 블루베리 3D</div>

  <div class="head">
    <div class="eyebrow fade d1">GYEONGJU · GAP FARM</div>
    <h1 class="fade d2">당신이 탐내는<br>바로 그 맛.</h1>
    <p class="fade d3">경주 산수밭들의 햇살 아래 정성껏 키워<br>수확한 그날 보내드립니다.</p>
    <a href="https://verytamna.github.io/verytamna/" class="shop fade d4">블루베리 주문하기 <i>+</i></a>
  </div>

  <div class="grades fade d3" role="radiogroup" aria-label="등급 선택">
    <button class="grade on" data-g="0" role="radio" aria-checked="true">
      <div class="dots"><b style="width:30px;height:30px"></b><b style="width:26px;height:26px"></b></div>
      <strong>왕특</strong><small>18mm 이상</small><em>45,000원/kg</em>
    </button>
    <button class="grade" data-g="1" role="radio" aria-checked="false">
      <div class="dots"><b style="width:23px;height:23px"></b><b style="width:20px;height:20px"></b><b style="width:22px;height:22px"></b></div>
      <strong>특대</strong><small>16~18mm</small><em>40,000원/kg</em>
    </button>
    <button class="grade" data-g="2" role="radio" aria-checked="false">
      <div class="dots"><b style="width:17px;height:17px"></b><b style="width:15px;height:15px"></b><b style="width:16px;height:16px"></b><b style="width:15px;height:15px"></b></div>
      <strong>대</strong><small>14~16mm</small><em>35,000원/kg</em>
    </button>
  </div>

  <div class="badge fade d4"><div class="ico">GAP</div><div><span>CERTIFIED FARM</span><b>경주 · 가족 블루베리 농장</b></div></div>
  <div class="hint fade d4">등급을 고르거나 화면을 눌러보세요</div>
  <div class="script">Verytamna</div>
  <a href="https://verytamna.github.io/verytamna/" class="m-order">블루베리 주문하기 →</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('scene');
  if(!window.THREE){ return; }

  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 9);

  scene.add(new THREE.AmbientLight(0xbfc8ff, 0.55));
  var key = new THREE.DirectionalLight(0xffffff, 1.15); key.position.set(-4, 5, 6); scene.add(key);
  var rim = new THREE.DirectionalLight(0x8fa6ff, 0.9); rim.position.set(5, -2, -4); scene.add(rim);
  var fill = new THREE.PointLight(0xffe6c8, 0.35, 30); fill.position.set(3, 3, 5); scene.add(fill);

  // bloom (white dusty coating) texture
  function bloomTexture(){
    var c = document.createElement('canvas'); c.width = 512; c.height = 256;
    var g = c.getContext('2d');
    var grd = g.createLinearGradient(0,0,0,256);
    grd.addColorStop(0,'#3a4880'); grd.addColorStop(.5,'#2b376b'); grd.addColorStop(1,'#1f2856');
    g.fillStyle = grd; g.fillRect(0,0,512,256);
    for(var i=0;i<9000;i++){
      var a = Math.random()*0.2;
      g.fillStyle = 'rgba(200,210,240,'+a+')';
      var r = Math.random()*2.2;
      g.beginPath(); g.arc(Math.random()*512, Math.random()*256, r, 0, Math.PI*2); g.fill();
    }
    for(var j=0;j<40;j++){
      g.fillStyle = 'rgba(190,200,235,'+(Math.random()*0.12)+')';
      g.beginPath(); g.ellipse(Math.random()*512, Math.random()*256, 20+Math.random()*50, 8+Math.random()*20, Math.random()*3, 0, Math.PI*2); g.fill();
    }
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  var berryMat = new THREE.MeshStandardMaterial({map:bloomTexture(), roughness:0.62, metalness:0.0});
  var crownMat = new THREE.MeshStandardMaterial({color:0x2a2c45, roughness:0.85});
  var leafMat = new THREE.MeshStandardMaterial({color:0x1d4a26, roughness:0.6, side:THREE.DoubleSide});
  var berryGeo = new THREE.SphereGeometry(1, 72, 72);

  function makeBerry(){
    var grp = new THREE.Group();
    var body = new THREE.Mesh(berryGeo, berryMat);
    body.scale.set(1, 0.86, 1);
    grp.add(body);
    // crown: shallow dimple ring + 5 sepals
    var crown = new THREE.Group();
    var ring = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.05, 12, 30), crownMat);
    ring.rotation.x = Math.PI/2; crown.add(ring);
    for(var i=0;i<5;i++){
      var s = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.24, 8), crownMat);
      var ang = i/5*Math.PI*2;
      s.position.set(Math.cos(ang)*0.22, 0.04, Math.sin(ang)*0.22);
      s.rotation.z = -Math.cos(ang)*1.1; s.rotation.x = Math.sin(ang)*1.1;
      crown.add(s);
    }
    var core = new THREE.Mesh(new THREE.CircleGeometry(0.16, 20), crownMat);
    core.rotation.x = -Math.PI/2; core.position.y = -0.01; crown.add(core);
    crown.position.y = 0.84;
    grp.add(crown);
    return grp;
  }
  function makeLeaf(){
    var sh = new THREE.Shape();
    sh.moveTo(0,0); sh.quadraticCurveTo(0.45,0.35,0,1.25); sh.quadraticCurveTo(-0.45,0.35,0,0);
    var m = new THREE.Mesh(new THREE.ShapeGeometry(sh, 16), leafMat);
    return m;
  }

  // hero berry cluster
  var hero = new THREE.Group(); scene.add(hero);
  var main = makeBerry(); main.rotation.set(0.5, 0, -0.25); hero.add(main);
  var side1 = makeBerry(); side1.scale.setScalar(0.62); side1.position.set(-1.05, -0.75, 0.35); side1.rotation.set(0.9,0.4,0.5); hero.add(side1);
  var side2 = makeBerry(); side2.scale.setScalar(0.5); side2.position.set(0.95, -0.95, 0.5); side2.rotation.set(-0.3,0.2,-0.7); hero.add(side2);
  var leaf1 = makeLeaf(); leaf1.position.set(0.3, 0.75, -0.4); leaf1.rotation.set(-0.6, 0.3, -0.9); leaf1.scale.setScalar(1.1); hero.add(leaf1);
  var leaf2 = makeLeaf(); leaf2.position.set(-0.4, 0.7, -0.5); leaf2.rotation.set(-0.5, -0.4, 0.8); leaf2.scale.setScalar(0.85); hero.add(leaf2);

  // floating berries around
  var floaters = [];
  for(var i=0;i<7;i++){
    var b = makeBerry();
    var s = 0.1 + Math.random()*0.14;
    b.scale.setScalar(s);
    var ang = Math.random()*Math.PI*2, rad = 3.2 + Math.random()*2.4;
    b.userData = {ang:ang, rad:rad, y:(Math.random()-.5)*4, sp:0.05+Math.random()*0.08, rot:new THREE.Vector3(Math.random(),Math.random(),Math.random())};
    scene.add(b); floaters.push(b);
  }

  // bubbles/particles of light
  var pGeo = new THREE.BufferGeometry(), N = 160, pos = new Float32Array(N*3);
  for(var k=0;k<N;k++){ pos[k*3]=(Math.random()-.5)*16; pos[k*3+1]=(Math.random()-.5)*10; pos[k*3+2]=-3-Math.random()*4; }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var particles = new THREE.Points(pGeo, new THREE.PointsMaterial({color:0xc9d4ff, size:0.035, transparent:true, opacity:0.55}));
  scene.add(particles);

  // burst on tap
  var bursts = [];
  var ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0), hit = new THREE.Vector3();
  function burst(cx, cy){
    var ndc = new THREE.Vector2((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
    ray.setFromCamera(ndc, camera); ray.ray.intersectPlane(plane, hit);
    for(var i=0;i<7;i++){
      var b = makeBerry(); var s = 0.08+Math.random()*0.1; b.scale.setScalar(s);
      b.position.copy(hit);
      var a = Math.random()*Math.PI*2, v = 0.05+Math.random()*0.07;
      b.userData = {v:new THREE.Vector3(Math.cos(a)*v, Math.sin(a)*v+0.03, (Math.random()-.5)*0.05), life:1, s:s, spin:new THREE.Vector3(Math.random()*.2,Math.random()*.2,0)};
      scene.add(b); bursts.push(b);
    }
  }
  canvas.addEventListener('pointerdown', function(e){ burst(e.clientX, e.clientY); });

  // pointer follow
  var target = {x:0,y:0}, cur = {x:0,y:0};
  window.addEventListener('pointermove', function(e){ target.x = (e.clientX/innerWidth)*2-1; target.y = (e.clientY/innerHeight)*2-1; });

  // grades: scale + world color
  var GRADES = [
    {scale:1.12, bg1:'#24336e', bg2:'#0b1230', accent:'#c9d4ff'},
    {scale:0.96, bg1:'#45285f', bg2:'#140b26', accent:'#f0c9ff'},
    {scale:0.82, bg1:'#17505a', bg2:'#071a20', accent:'#bff0e6'}
  ];
  var targetScale = GRADES[0].scale, curScale = 0.0001;
  var root = document.documentElement;
  document.querySelectorAll('.grade').forEach(function(btn){
    btn.addEventListener('click', function(){
      var g = GRADES[+btn.dataset.g];
      document.querySelectorAll('.grade').forEach(function(b){ b.classList.toggle('on', b===btn); b.setAttribute('aria-checked', b===btn); });
      root.style.setProperty('--bg1', g.bg1); root.style.setProperty('--bg2', g.bg2); root.style.setProperty('--accent', g.accent);
      document.body.style.background = 'radial-gradient(120% 90% at 50% 40%,'+g.bg1+' 0%,'+g.bg2+' 75%)';
      particles.material.color.set(g.accent);
      targetScale = g.scale;
      spinKick = 0.35;
    });
  });
  var spinKick = 0;

  function layout(){
    var w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    var mobile = w < 900;
    hero.position.set(mobile ? 0 : 0.35, mobile ? -0.05 : -0.15, 0);
    baseFit = mobile ? Math.min(1.45, w/h*2.6) : 1.75;
  }
  var baseFit = 1;
  window.addEventListener('resize', layout); layout();

  var clock = new THREE.Clock();
  function tick(){
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    cur.x += (target.x - cur.x) * 0.05; cur.y += (target.y - cur.y) * 0.05;
    curScale += (targetScale - curScale) * 0.08;
    hero.scale.setScalar(curScale * baseFit);
    hero.rotation.y = cur.x * 0.55 + spinKick * Math.sin(t*6) ;
    hero.rotation.x = cur.y * 0.3;
    hero.position.y += ((innerWidth<900?-0.05:-0.15) + Math.sin(t*1.1)*0.08 - hero.position.y) * 0.1;
    spinKick *= 0.94;
    main.rotation.y += dt*0.15;

    floaters.forEach(function(b){
      var u = b.userData; u.ang += u.sp*dt;
      b.position.set(Math.cos(u.ang)*u.rad + cur.x*0.4, u.y + Math.sin(t*0.8+u.ang)*0.25 - cur.y*0.3, Math.sin(u.ang)*1.2 - 3.2);
      b.rotation.x += u.rot.x*dt*0.5; b.rotation.y += u.rot.y*dt*0.5;
    });
    particles.rotation.y = cur.x*0.08; particles.position.y = Math.sin(t*0.2)*0.2;

    for(var i=bursts.length-1;i>=0;i--){
      var b = bursts[i], u = b.userData;
      b.position.add(u.v); u.v.y -= 0.0025; u.v.multiplyScalar(0.985);
      b.rotation.x += u.spin.x; b.rotation.y += u.spin.y;
      u.life -= dt*0.6;
      b.scale.setScalar(Math.max(0.0001, u.s * Math.min(1, u.life*2)));
      if(u.life <= 0){ scene.remove(b); bursts.splice(i,1); }
    }
    renderer.render(scene, camera);
    if(!reduce) requestAnimationFrame(tick);
  }
  if(reduce){ curScale = targetScale; tick(); window.addEventListener('resize', function(){ tick(); }); }
  else requestAnimationFrame(tick);
})();
</script>
</body>
</html>
